title: Pixel 9a
views:
  - title: Pixel 9a | Maison
    path: mobile
    icon: mdi:cellphone
    cards:
      - type: custom:mushroom-template-card
        primary: Pixel 9a
        secondary: >-
          {% set modes = [] %}
          {% if is_state('input_boolean.guest_mode', 'on') %}{% set modes = modes + ['Invité'] %}{% endif %}
          {% if is_state('input_boolean.andre_mode', 'on') %}{% set modes = modes + ['André'] %}{% endif %}
          {% if is_state('input_boolean.vacances', 'on') %}{% set modes = modes + ['Vacances'] %}{% endif %}
          {% if is_state('input_boolean.luc_absent', 'on') %}{% set modes = modes + ['Luc absent'] %}{% endif %}
          {{ modes | join(' · ') if modes else states('input_select.house_profile') }}
        icon: mdi:cellphone
        icon_color: blue
        tap_action:
          action: none

      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:tune
            icon_color: green
            content: Contrôle
            tap_action:
              action: navigate
              navigation_path: /pixel-9a/controle-rapide
          - type: template
            icon: mdi:lightning-bolt
            icon_color: orange
            content: Actions
            tap_action:
              action: navigate
              navigation_path: /pixel-9a/actions-rapides
          - type: template
            icon: mdi:blinds
            icon_color: cyan
            content: Stores
            tap_action:
              action: navigate
              navigation_path: /pixel-9a/stores

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Poules
            secondary: "{{ 'Allumé' if is_state('light.poulailler', 'on') else 'Éteint' }}"
            icon: mdi:egg
            icon_color: "{{ 'yellow' if is_state('light.poulailler', 'on') else 'disabled' }}"
            layout: horizontal
            entity: light.poulailler
            tap_action:
              action: perform-action
              perform_action: script.toggle_poules
          - type: custom:mushroom-template-card
            primary: Flash 30s
            secondary: "{{ 'Jour seulement' if is_state('sun.sun', 'above_horizon') else 'Nuit - inactif' }}"
            icon: mdi:alarm-light-outline
            icon_color: "{{ 'orange' if is_state('sun.sun', 'above_horizon') else 'grey' }}"
            layout: horizontal
            tap_action:
              action: perform-action
              perform_action: script.flash_poulailler_30s

      - type: grid
        title: Pièces
        columns: 3
        square: false
        cards:
          - type: area
            area: salon
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-salon"
          - type: area
            area: foyer
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-foyer"
          - type: area
            area: salle_a_manger
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-salle_a_manger"
          - type: area
            area: cuisine
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-cuisine"
          - type: area
            area: entree
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-entree"
          - type: area
            area: chambre
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-chambre"
          - type: area
            area: poulailler
            alert_classes:
              - motion
              - moisture
            sensor_classes:
              - temperature
              - humidity
            display_type: picture
            features_position: bottom
            vertical: false
            tap_action:
              action: navigate
              navigation_path: "/home/areas-poulailler"

      - type: grid
        title: Éclairage
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.salle_a_manger
            name: Salle a manger
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.entree_2
            name: Entree
            show_brightness_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.cote_luc
            name: Cote Luc
            show_brightness_control: true
            show_color_temp_control: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.armoire
            name: Armoire
            show_brightness_control: true
            collapsible_controls: true

      - type: custom:mushroom-media-player-card
        entity: media_player.tele_qn50ls03aafxzc
        name: TV Salon
        use_media_info: true
        show_volume_level: true
        volume_controls:
          - volume_mute
          - volume_set

      - type: custom:mushroom-title-card
        title: Statuts maison

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Porte
            secondary: "{{ 'Verrouillé' if is_state('lock.porte', 'locked') else 'Déverrouillé' }}"
            icon: mdi:door-closed-lock
            icon_color: "{{ 'red' if is_state('lock.porte', 'unlocked') else 'green' }}"
            entity: lock.porte
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: binary_sensor.porte_porte
            name: Capteur porte
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.porte_temps_deverrouillee
            name: Temps déverrouillée
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.temps_porte_ouverte
            name: Temps ouvert
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.veranda_temperature
            name: Temp. véranda
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.veranda_humidite
            name: Humid. véranda
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.temperatureg_temperature
            name: Temp. garage
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.temperatureg_humidite
            name: Humid. garage
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: weather.forecast_maison
            name: Météo
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: input_select.house_profile
            name: Profil maison
            icon: mdi:home-account
            tap_action:
              action: more-info

  - title: Controle rapide
    path: controle-rapide
    icon: mdi:tune
    subview: true
    cards:
      - type: custom:mushroom-title-card
        title: Controle rapide
        subtitle: Modes et minuteries

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Maison
            secondary: "{{ 'Activé' if is_state('input_boolean.home_mode', 'on') else 'Désactivé' }}"
            icon: mdi:home
            icon_color: "{{ 'yellow' if is_state('input_boolean.home_mode', 'on') else 'disabled' }}"
            entity: input_boolean.home_mode
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Invite
            secondary: "{{ 'Activé · ' if is_state('input_boolean.guest_mode', 'on') else '' }}Pause atténuation & mode TV"
            icon: mdi:account-multiple
            icon_color: "{{ 'yellow' if is_state('input_boolean.guest_mode', 'on') else 'disabled' }}"
            entity: input_boolean.guest_mode
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Andre
            secondary: "{{ 'Activé · ' if is_state('input_boolean.andre_mode', 'on') else '' }}Pause stores, soirée & TV"
            icon: mdi:account
            icon_color: "{{ 'yellow' if is_state('input_boolean.andre_mode', 'on') else 'disabled' }}"
            entity: input_boolean.andre_mode
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Vacances
            secondary: "{{ 'Activé · ' if is_state('input_boolean.vacances', 'on') else '' }}Pause réveil & bureau"
            icon: mdi:palm-tree
            icon_color: "{{ 'yellow' if is_state('input_boolean.vacances', 'on') else 'disabled' }}"
            entity: input_boolean.vacances
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Luc absent
            secondary: "{{ 'Activé · ' if is_state('input_boolean.luc_absent', 'on') else '' }}Extinction auto ~22h30"
            icon: mdi:account-arrow-right
            icon_color: "{{ 'red' if is_state('input_boolean.luc_absent', 'on') else 'disabled' }}"
            entity: input_boolean.luc_absent
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Focus
            secondary: "{{ 'Actif' if is_state('timer.focus_session', 'active') else 'Inactif' }}"
            icon: mdi:timer
            icon_color: "{{ 'yellow' if is_state('timer.focus_session', 'active') else 'disabled' }}"
            entity: timer.focus_session
            tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Prochain lever
            secondary: >-
              {{ as_local(state_attr('sun.sun', 'next_rising')).strftime('%H:%M')
              if state_attr('sun.sun', 'next_rising') else 'Indisponible' }}
            icon: mdi:weather-sunset-up
            icon_color: amber
            entity: sun.sun
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Prochain coucher
            secondary: >-
              {{ as_local(state_attr('sun.sun', 'next_setting')).strftime('%H:%M')
              if state_attr('sun.sun', 'next_setting') else 'Indisponible' }}
            icon: mdi:weather-sunset-down
            icon_color: orange
            entity: sun.sun
            tap_action:
              action: more-info

      - type: custom:mushroom-template-card
        primary: Vacances | Luc absent
        secondary: Ouvrir calendrier pour ajouter des dates
        icon: mdi:calendar-month
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /calendar

      - type: calendar
        entities:
          - calendar.luc_absent

  - title: Actions rapides
    path: actions-rapides
    icon: mdi:lightning-bolt
    subview: true
    cards:
      - type: custom:mushroom-title-card
        title: Actions rapides
        subtitle: Confirmez votre action

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Bonne nuit
            secondary: Lance la sequence de nuit
            icon: mdi:weather-night
            icon_color: deep-purple
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.night_shutdown_except_adresse
              confirmation: true
          - type: custom:mushroom-template-card
            primary: Verrouiller porte
            secondary: Script securise
            icon: mdi:lock
            icon_color: indigo
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.lock_porte_securise
              confirmation: true
          - type: custom:mushroom-template-card
            primary: Off sauf chambre
            secondary: Éteint tout sauf chambre maîtres
            icon: mdi:lightbulb-off
            icon_color: blue-grey
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.lights_off_sauf_chambre
              confirmation: true

  - title: Stores
    path: stores
    icon: mdi:blinds
    subview: true
    cards:
      - type: custom:mushroom-title-card
        title: Stores
        subtitle: Tous les stores de la maison

      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.salon
                name: Salon
                show_position_control: true
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: binary_sensor.capteur_store_salon_inverse
                    name: Capteur store salon
                  - type: custom:mushroom-entity-card
                    entity: sensor.capteur_store_salon_batterie
                    name: Batterie capteur store salon
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.porte_patio
                name: Porte patio
                show_position_control: true
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: binary_sensor.capteur_store_salle_a_manger_inverse
                    name: Capteur store porte patio
                  - type: custom:mushroom-entity-card
                    entity: sensor.capteur_store_salle_a_manger_batterie
                    name: Batterie capteur store porte_patio
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.bureau
                name: Bureau
                show_position_control: true
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: binary_sensor.capteur_store_bureau_luc
                    name: Capteur store bureau
                  - type: custom:mushroom-entity-card
                    entity: sensor.capteur_store_bureau_luc_batterie
                    name: Batterie capteur store bureau
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.chambre_maitre
                name: Chambre maitre
                show_position_control: true
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: binary_sensor.capteur_store_chambre_maitre
                    name: Capteur store chambre maitre
                  - type: custom:mushroom-entity-card
                    entity: sensor.capteur_store_chambre_maitre_batterie
                    name: Batterie capteur store chambre maitre
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-cover-card
                entity: cover.chambre_amis
                name: Chambre amis
                show_position_control: true
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-entity-card
                    entity: binary_sensor.capteur_store_chambre_amie
                    name: Capteur store chambre amis
                  - type: custom:mushroom-entity-card
                    entity: sensor.capteur_store_chambre_amie_batterie
                    name: Batterie capteur store chambre amie
